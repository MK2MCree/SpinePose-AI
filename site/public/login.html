<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="登录脊见智诊工作台">
    <title>登录｜脊见智诊 SpineInsight</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="vendor/fontawesome-free-6.0.0/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page" data-page="login">
    <div class="auth-grid"></div>
    <main class="auth-shell">
        <section class="auth-intro" aria-label="产品介绍">
            <a class="auth-brand" href="index.html"><span class="auth-brand-mark"><img src="logo.png" alt=""></span><span>SpineInsight</span></a>
            <p class="auth-intro-copy">登录后即可使用影像导入、智能测算和报告导出功能。账号资料会保存在当前设备的本地数据库中。</p>
        </section>
        <section class="auth-card" aria-labelledby="login-title">
            <h2 id="login-title">登录</h2>
            <p>请输入账号密码以继续。</p>
            <div id="login-account-choices" class="auth-choices" hidden></div>
            <form id="login-form" novalidate>
                <div class="auth-field"><label for="login-username">用户名</label><input id="login-username" name="username" autocomplete="username" maxlength="32" required placeholder="输入你的用户名"></div>
                <div class="auth-field"><label for="login-password">密码</label><input id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="输入密码"></div>
                <p id="login-message" class="auth-message" aria-live="polite"></p>
                <button id="login-submit" class="auth-submit" type="submit">登录</button>
            </form>
            <p class="auth-footnote">还没有账号？ <a href="register.html">创建账号</a></p>
        </section>
    </main>
    <script src="auth.js"></script>
</body>
</html>
